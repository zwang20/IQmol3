name: Build
on: [ push, pull_request ]
jobs:
  build-project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Build Project
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout Project
        if: ${{ matrix.os != 'windows-latest' }}
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
      
      - name: Checkout Project on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/checkout@v4.2.2

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1

      - name: Install Qt
        if: ${{ matrix.os != 'macos-latest' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.*
      
      - name: Install Dependencies on Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt update
          sudo apt install librust-bzip2-dev -y
          sudo apt install liblzma-dev -y
          sudo apt install libb2-dev -y
          sudo apt install libssh2-1-dev -y
          sudo apt install libqglviewer-headers libqglviewer-dev-qt5 -y
          sudo apt install libopenmesh-dev -y
          sudo apt install libyaml-cpp-dev -y
          sudo apt install libopenbabel-dev -y
          sudo apt install libboost-iostreams-dev libboost-serialization-dev -y
      
      - name: Install Dependencies on MacOS
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install qt@5
          brew install boost
          brew install open-babel
      
      - name: Install boost on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/MarkusJx/prebuilt-boost/blob/main/versions-manifest.json
          boost_version: 1.73.0

      - name: Build Project on Ubuntu
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          QGLViewer_DIR: 
        run: |
          cmake -B build
          cmake --build build --parallel

      - name: Build Project on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        uses: threeal/cmake-action@v2.1.0

      - name: Build Project on MacOS
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          LDFLAGS: -L/opt/homebrew/opt/qt@5/lib
          CPPFLAGS: -I/opt/homebrew/opt/qt@5/include
        run: |
          cmake -B build
          cmake --build build --parallel